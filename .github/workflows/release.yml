name: Release

on:
  push:
    branches: [main]
    paths:
      - "pubsub/**"
      - "redis/**"
      - "storage/**"

permissions:
  contents: write

# Each run derives its tags from the commits since the last ones, so two runs
# must not compute from the same base. A running release is never cancelled;
# a newer queued run supersedes an older queued one, and since versions are
# computed from every commit since the last tag, it releases both pushes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # One module refusing to release, or failing its tests, must not cancel
      # the other modules' releases.
      fail-fast: false
      matrix:
        module: [pubsub, redis, storage]
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      # No git push happens here - gh uses GH_TOKEN, which only the create
      # step sees - so the token is not stored in the git config, and the
      # tests below run without write access.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The level comes from Release-As trailers and conventional-commit
      # markers on the changes that touched this module; see
      # .github/scripts/next-version.sh and its test for the rules.
      - name: Determine next version
        id: version
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          base=$(.github/scripts/next-version.sh --base "$MODULE")
          next=$(.github/scripts/next-version.sh "$MODULE")
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          if [ "$next" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${next}" >> "$GITHUB_OUTPUT"
          fi

      # A tag on the module proxy cannot be withdrawn, so a module about to
      # be released is built and tested first, on its floor (the go
      # directive in its go.mod) and on the newest Go - whatever the branch
      # protection requires of the pull request.
      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Test on the floor
        if: steps.version.outputs.skip != 'true'
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -count=1

      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version: "1.27.x"

      - name: Test on the newest Go
        if: steps.version.outputs.skip != 'true'
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1

      # One call creates the tag and the release, so a failure leaves neither
      # and a re-run retries both; a tag pushed on its own would make the
      # re-run see an unchanged module and never create the release. Notes
      # start from this module's newest release tag reachable from this
      # commit, not from the newest release of any module.
      - name: Create tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          BASE_TAG: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          # The version goes past every tag this clone has, but one pushed
          # to the remote since checkout would make gh attach the release to
          # it and ignore --target.
          if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${NEW_TAG}" 2>/dev/null; then
            echo "::error::${NEW_TAG} already exists on the remote; refusing to release on it." >&2
            exit 1
          fi
          notes_from=()
          if [ -n "$BASE_TAG" ]; then
            notes_from=(--notes-start-tag "$BASE_TAG")
          fi
          # The ${a[@]+...} form expands an empty array safely under `set -u`
          # on bash before 4.4 as well.
          gh release create "$NEW_TAG" --target "$GITHUB_SHA" --generate-notes ${notes_from[@]+"${notes_from[@]}"} --title "$NEW_TAG"
