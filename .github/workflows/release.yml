name: Release

on:
  push:
    branches: [main]
    paths:
      - "pubsub/**"
      - "redis/**"
      - "storage/**"

permissions:
  contents: write

# Each run derives its tags from the commits since the last ones, so two runs
# must not compute from the same base. A running release is never cancelled;
# a newer queued run supersedes an older queued one, and since versions are
# computed from every commit since the last tag, it releases both pushes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The branch does not require the pull-request checks, so a merge with red
  # CI or a direct push would otherwise publish untested code, and a tag on
  # the module proxy cannot be withdrawn. Every module is verified, not only
  # the changed ones: any of them may be released below.
  verify:
    name: Verify (${{ matrix.module }}, go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # The tests need no write access; only the release job does.
    permissions:
      contents: read
    strategy:
      matrix:
        module: [pubsub, redis, storage]
        # "floor" reads the go directive from the module's go.mod.
        go: [floor, "1.27.x"]
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'floor' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'floor' && format('{0}/go.mod', matrix.module) || '' }}

      - name: Build, vet and test
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -count=1

  release:
    name: Release (${{ matrix.module }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # One module refusing to release (see next-version.sh) must not cancel
      # the other modules' releases.
      fail-fast: false
      matrix:
        module: [pubsub, redis, storage]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The level comes from Release-As trailers and conventional-commit
      # markers on the changes that touched this module; see
      # .github/scripts/next-version.sh and its test for the rules.
      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          base=$(.github/scripts/next-version.sh --base "${{ matrix.module }}")
          next=$(.github/scripts/next-version.sh "${{ matrix.module }}")
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          if [ "$next" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${next}" >> "$GITHUB_OUTPUT"
          fi

      # One call creates the tag and the release, so a failure leaves neither
      # and a re-run retries both; a tag pushed on its own would make the
      # re-run see an unchanged module and never create the release. Notes
      # start from the tag the version was computed from, not from the newest
      # release of any module.
      - name: Create tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          BASE_TAG: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          # Only tags reachable from HEAD are a version's base, so a stray tag
          # elsewhere may already carry this name; publishing a release on it
          # would silently point the release at that commit.
          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "::error::${NEW_TAG} already exists on another commit; refusing to release on it." >&2
            exit 1
          fi
          notes_from=()
          if [ -n "$BASE_TAG" ]; then
            notes_from=(--notes-start-tag "$BASE_TAG")
          fi
          # The ${a[@]+...} form expands an empty array safely under `set -u`
          # on bash before 4.4 as well.
          gh release create "$NEW_TAG" --target "$GITHUB_SHA" --generate-notes ${notes_from[@]+"${notes_from[@]}"} --title "$NEW_TAG"
